; PlatformIO Project Configuration File
; AgriSecure IoT System - Firmware per ESP32-C6/ESP32-S3
;
; Prototipo 3 Nodi:
; - NODE_GATEWAY: Gateway con 4G/LTE (ESP32-S3)
; - NODE_AMBIENT: Sensori ambientali (ESP32-C6)
; - NODE_SECURITY: Sicurezza perimetrale (ESP32-C6)

[platformio]
default_envs = node_gateway
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

; ============================================================
; Configurazione comune a tutti i nodi
; ============================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partizioni per OTA
board_build.partitions = min_spiffs.csv

; Flags di compilazione comuni
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    ; NB: ARDUINO_USB_MODE/ARDUINO_USB_CDC_ON_BOOT rimossi da qui (agosto 2026):
    ; sono specifici dei chip con USB nativo (S2/S3/C3/C6/H2). Forzati su ESP32
    ; classico (WROOM-32, usato da AMB-001) causavano "Serial not declared".
    ; Vanno definiti SOLO nell'env del gateway (ESP32-S3, USB nativo reale).
    ; Versione firmware
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DFIRMWARE_BUILD_DATE=\"${UNIX_TIME}\"
    ; Configurazione mesh
    -DMESH_CHANNEL=1
    -DMESH_MAX_NODES=25
    -DMESH_HEARTBEAT_INTERVAL=1800000
    ; Encryption key (32 bytes hex) - CAMBIARE IN PRODUZIONE!
    -DMESH_ENCRYPTION_KEY=\"0123456789ABCDEF0123456789ABCDEF\"

; Librerie comuni
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    256dpi/MQTT@^2.5.0

; ============================================================
; NODO GATEWAY - Connettività 4G/Internet
; ============================================================
[env:node_gateway]
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<*> -<main_ambient.cpp> -<main_security.cpp> -<sensors_ambient.cpp> -<sensors_security.cpp> -<main_gateway.cpp>
; Hardware reale: modulo UICPAL ESP32-S3-N16R8 (16MB flash, 8MB PSRAM, dual USB-C)
; NB: diverso da AMB/SEC che restano su ESP32-C6 (da confermare quando si svilupperanno)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram_type = opi
build_flags = 
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DNODE_TYPE=0  ; NODE_GATEWAY (vedi nota in main.cpp)
    -DNODE_ID=\"GW-001\"
    -DTINY_GSM_DEBUG=Serial
    ; Configurazione 4G
    -DMODEM_RST=5
    -DMODEM_PWRKEY=4
    -DMODEM_TX=17
    -DMODEM_RX=18
    ; MQTT
    -DMQTT_BROKER=\"agrisecure.tgs.ovh\"
    -DMQTT_PORT=8883
    -DMQTT_USER=\"agrisecure\"
    -DMQTT_PASS=\"mqtt_secure_password\"
    ; GPS
    -DGPS_ENABLED=1

lib_deps = 
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.11.7
    https://github.com/alkonosst/SSLClientESP32.git#v2.0.3
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.0.3

; ============================================================
; NODO AMBIENTALE - Monitoraggio clima/suolo
; ============================================================
[env:node_ambient]
build_src_filter = +<*> -<main_gateway.cpp> -<main_security.cpp> -<sensors_security.cpp> -<main_ambient.cpp>
; Hardware reale: ESP32-WROOM-32D (board USB-C, 4MB flash) - NON C6 come originariamente documentato
board = esp32dev
build_flags = 
    ${env.build_flags}
    -DNODE_TYPE=1  ; NODE_AMBIENT (vedi nota in main.cpp)
    -DNODE_ID=\"AMB-001\"
    ; Pin sensori (rimappati per ESP32 classico: GPIO6/7/0 non validi, riservati flash SPI/strapping)
    ; NB (fix post-test hardware): il nome macro corretto e' I2C_SDA/I2C_SCL,
    ; non BME280_SDA/SCL - begin() in sensors_ambient.h usa I2C_SDA/I2C_SCL
    ; come default arg (da agrisecure_config.h). BME280_SDA/SCL erano flag
    ; morti, mai letti da nessun file: causavano crash reale su hardware
    ; (Wire.begin su GPIO6/7, riservati a flash SPI -> watchdog reset loop).
    -DI2C_SDA=21
    -DI2C_SCL=22
    -DSOIL_PIN=34
    -DBH1750_ADDR=0x23
    ; LED di stato onboard (etichetta "D2" sulla board fisica)
    -DLED_STATUS=2
    ; Intervallo letture (ms)
    -DSENSOR_READ_INTERVAL=600000
    ; Deep sleep
    -DDEEP_SLEEP_ENABLED=1
    -DDEEP_SLEEP_DURATION=600

lib_deps = 
    ${env.lib_deps}
    ; Fix agosto 2026: modulo fisico e' un BMP280 (chip-ID 0x58, non 0x60),
    ; nonostante l'etichetta "GY-BMEP" - vedi note in sensors_ambient.h/.cpp
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.9
    claws/BH1750@^1.3.0

; ============================================================
; NODO SICUREZZA - Antintrusione perimetrale
; ============================================================
[env:node_security]
build_src_filter = +<*> -<main_gateway.cpp> -<main_ambient.cpp> -<sensors_ambient.cpp> -<main_security.cpp>
; Hardware reale: ESP32-WROOM-32 (Espressif originale, bridge CP2102) - NON C6
; Verificato fisicamente agosto 2026, stesso caso gia' visto su GW/AMB:
; board C6 assunta in fase di progettazione, mai confermata sull'hardware reale.
board = esp32dev
build_flags = 
    ${env.build_flags}
    -DNODE_TYPE=2  ; NODE_SECURITY (vedi nota in main.cpp)
    -DNODE_ID=\"SEC-001\"
    ; Pin sensori (rimappati per ESP32 classico: GPIO6-11 riservati a flash SPI interna,
    ; GPIO1/3 = UART0/monitor seriale - stesso tipo di vincolo gia' risolto su AMB-001)
    ; Fase attuale: 1 solo PIR fisico disponibile (PIR_MAIN). PIR_BACKUP predisposto
    ; nel pin ma non cablato - va letto con INPUT_PULLDOWN lato firmware per evitare
    ; letture floating (fix separato in sensors_security.cpp).
    -DPIR_MAIN_PIN=4
    -DPIR_BACKUP_PIN=13
    ; NB (fix pre-cablaggio): il nome macro corretto e' I2C_SDA/I2C_SCL, non
    ; MPU6050_SDA/SCL - begin() in sensors_security.h usa I2C_SDA/I2C_SCL come
    ; default arg. MPU6050_SDA/SCL erano flag morti, mai letti da nessun file
    ; (stesso identico bug gia' risolto su AMB-001 con BME280_SDA/SCL).
    ; MPU6050 non ancora disponibile fisicamente: pin predisposti, non cablati.
    -DI2C_SDA=21
    -DI2C_SCL=22
    -DLED_STATUS=2
    ; Pin attuatori - fase attuale: 1 solo relè fisico disponibile (sirena,
    ; modulo attivo-alto 3 pin, stesso tipo Fabbrica ESP32 febbraio 2026).
    ; RELAY_LIGHT predisposto nel pin ma non cablato.
    -DRELAY_SIREN_PIN=32
    -DRELAY_LIGHT_PIN=33
    ; Soglie discriminazione
    -DPERSON_HEIGHT_MIN=120
    -DANIMAL_HEIGHT_MAX=80
    ; Allarme
    -DALARM_DURATION=30000
    -DALARM_COOLDOWN=60000

lib_deps = 
    ${env.lib_deps}
    electroniccats/MPU6050@^1.3.0

; ============================================================
; Ambiente di TEST/DEBUG
; ============================================================
[env:test_node]
build_src_filter = +<*> -<main_gateway.cpp> -<main_ambient.cpp> -<main_security.cpp>
board = esp32-c6-devkitc-1
build_flags = 
    ${env.build_flags}
    -DNODE_TYPE=99  ; NODE_TEST (vedi nota in main.cpp)
    -DNODE_ID=\"TEST-001\"
    -DDEBUG_MODE=1
    -DSERIAL_DEBUG=1

lib_deps = 
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    claws/BH1750@^1.3.0
    electroniccats/MPU6050@^1.3.0
    vshymanskyy/TinyGSM@^0.11.7
