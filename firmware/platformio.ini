; PlatformIO Project Configuration File
; AgriSecure IoT System - Firmware per ESP32-C6/ESP32-S3
;
; Prototipo 3 Nodi:
; - NODE_GATEWAY: Gateway con 4G/LTE (ESP32-S3)
; - NODE_AMBIENT: Sensori ambientali (ESP32-C6)
; - NODE_SECURITY: Sicurezza perimetrale (ESP32-C6)

[platformio]
default_envs = node_gateway
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

; ============================================================
; Configurazione comune a tutti i nodi
; ============================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partizioni per OTA
board_build.partitions = min_spiffs.csv

; Flags di compilazione comuni
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Versione firmware
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DFIRMWARE_BUILD_DATE=\"${UNIX_TIME}\"
    ; Configurazione mesh
    -DMESH_CHANNEL=1
    -DMESH_MAX_NODES=25
    -DMESH_HEARTBEAT_INTERVAL=1800000
    ; Encryption key (32 bytes hex) - CAMBIARE IN PRODUZIONE!
    -DMESH_ENCRYPTION_KEY=\"0123456789ABCDEF0123456789ABCDEF\"

; Librerie comuni
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    256dpi/MQTT@^2.5.0

; ============================================================
; NODO GATEWAY - Connettività 4G/Internet
; ============================================================
[env:node_gateway]
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<*> -<main_ambient.cpp> -<main_security.cpp> -<sensors_ambient.cpp> -<sensors_security.cpp> -<main_gateway.cpp>
; Hardware reale: modulo UICPAL ESP32-S3-N16R8 (16MB flash, 8MB PSRAM, dual USB-C)
; NB: diverso da AMB/SEC che restano su ESP32-C6 (da confermare quando si svilupperanno)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram_type = opi
build_flags = 
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DNODE_TYPE=NODE_GATEWAY
    -DNODE_ID=\"GW-001\"
    -DTINY_GSM_DEBUG=Serial
    ; Configurazione 4G
    -DMODEM_RST=5
    -DMODEM_PWRKEY=4
    -DMODEM_TX=17
    -DMODEM_RX=18
    ; MQTT
    -DMQTT_BROKER=\"agrisecure.tgs.ovh\"
    -DMQTT_PORT=8883
    -DMQTT_USER=\"agrisecure\"
    -DMQTT_PASS=\"mqtt_secure_password\"
    ; GPS
    -DGPS_ENABLED=1

lib_deps = 
    ${env.lib_deps}
    vshymanskyy/TinyGSM@^0.11.7
    https://github.com/alkonosst/SSLClientESP32.git#v2.0.3
    mikalhart/TinyGPSPlus@^1.0.3

; ============================================================
; NODO AMBIENTALE - Monitoraggio clima/suolo
; ============================================================
[env:node_ambient]
build_src_filter = +<*> -<main_gateway.cpp> -<main_security.cpp> -<sensors_security.cpp> -<main_ambient.cpp>
board = esp32-c6-devkitc-1
build_flags = 
    ${env.build_flags}
    -DNODE_TYPE=NODE_AMBIENT
    -DNODE_ID=\"AMB-001\"
    ; Pin sensori
    -DBME280_SDA=6
    -DBME280_SCL=7
    -DSOIL_PIN=0
    -DBH1750_ADDR=0x23
    ; Intervallo letture (ms)
    -DSENSOR_READ_INTERVAL=600000
    ; Deep sleep
    -DDEEP_SLEEP_ENABLED=1
    -DDEEP_SLEEP_DURATION=600

lib_deps = 
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    claws/BH1750@^1.3.0

; ============================================================
; NODO SICUREZZA - Antintrusione perimetrale
; ============================================================
[env:node_security]
build_src_filter = +<*> -<main_gateway.cpp> -<main_ambient.cpp> -<sensors_ambient.cpp> -<main_security.cpp>
board = esp32-c6-devkitc-1
build_flags = 
    ${env.build_flags}
    -DNODE_TYPE=NODE_SECURITY
    -DNODE_ID=\"SEC-001\"
    ; Pin sensori
    -DPIR_MAIN_PIN=2
    -DPIR_BACKUP_PIN=3
    -DMPU6050_SDA=6
    -DMPU6050_SCL=7
    ; Pin attuatori
    -DRELAY_SIREN_PIN=10
    -DRELAY_LIGHT_PIN=11
    ; Soglie discriminazione
    -DPERSON_HEIGHT_MIN=120
    -DANIMAL_HEIGHT_MAX=80
    ; Allarme
    -DALARM_DURATION=30000
    -DALARM_COOLDOWN=60000

lib_deps = 
    ${env.lib_deps}
    electroniccats/MPU6050@^1.3.0

; ============================================================
; Ambiente di TEST/DEBUG
; ============================================================
[env:test_node]
build_src_filter = +<*> -<main_gateway.cpp> -<main_ambient.cpp> -<main_security.cpp>
board = esp32-c6-devkitc-1
build_flags = 
    ${env.build_flags}
    -DNODE_TYPE=NODE_TEST
    -DNODE_ID=\"TEST-001\"
    -DDEBUG_MODE=1
    -DSERIAL_DEBUG=1

lib_deps = 
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    claws/BH1750@^1.3.0
    electroniccats/MPU6050@^1.3.0
    vshymanskyy/TinyGSM@^0.11.7
